<button
  type="button"
  class="btn btn-outline p-1 w-full"
  [disabled]="disabled"
  [class.opacity-50]="disabled"
  [class.cursor-not-allowed]="disabled"
  [class.pointer-events-none]="disabled"
  [attr.aria-label]="label"
  [title]="label"
>
  <!-- [aria-label]="label" -->
  @if(loadingSpinner){
  <div class="mx-3"><app-loading-spinner /></div>
  } @else{
  <ng-content />
  }
</button>
