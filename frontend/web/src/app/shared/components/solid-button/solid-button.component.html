<!--solid button-->
<button
  [type]="type"
  class="btn btn-solid p-1 w-full"
  aria-label="button"
  [title]="title"
  (click)="onClick($event)"
  [disabled]="disabled"
  [class.opacity-50]="disabled"
  [class.cursor-not-allowed]="disabled"
  [class.pointer-events-none]="disabled"
  [attr.aria-label]="label"
  [title]="label"
>
  @if(loadingSpinner){
  <div class="mx-3 h-5 w-5"><app-loading-spinner /></div>
  } @else{
  <ng-content />
  }
</button>
