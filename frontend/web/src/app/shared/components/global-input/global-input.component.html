<input
  [id]="inputId"
  [type]="inputType"
  [placeholder]="inputPlaceHolder"
  [value]="value"
  [disabled]="isDisabled"
  (input)="onInput($event)"
  (blur)="onBlur()"
  class="h-12 w-full rounded-2xl border border-slate-200 bg-slate-50/80 px-4 text-sm text-slate-800 placeholder:text-slate-400 shadow-sm transition-all duration-200 outline-none hover:border-slate-300 hover:bg-white focus:border-slate-400 focus:bg-white focus:shadow-md focus:ring-4 focus:ring-slate-200/70"
  autocomplete=""
/>
