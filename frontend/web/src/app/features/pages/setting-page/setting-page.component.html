<div
  class="min-h-screen bg-[var(--background-color)] text-[var(--text-color)] py-10 px-4"
>
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold">Settings</h1>
      <p class="mt-2 text-[var(--text-secondary)]">
        Manage your ThoughtNest account, writing preferences, and privacy.
      </p>
    </div>

    <div class="grid lg:grid-cols-4 gap-8">
      <!-- Sidebar -->
      <aside class="lg:col-span-1">
        <div
          class="sticky top-24 rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-3"
        >
          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left bg-[var(--accent-color)] text-white"
          >
            👤 Profile
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left hover:bg-[var(--hover-color)]"
          >
            📧 Account
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left hover:bg-[var(--hover-color)]"
          >
            ✍️ Writing
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left hover:bg-[var(--hover-color)]"
          >
            🔔 Notifications
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left hover:bg-[var(--hover-color)]"
          >
            🔒 Privacy
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left hover:bg-[var(--hover-color)]"
          >
            🎨 Appearance
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left hover:bg-[var(--hover-color)]"
          >
            🛡️ Security
          </button>

          <button
            class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30"
          >
            ⚠️ Danger Zone
          </button>
        </div>
      </aside>

      <!-- Right Content -->
      <section class="lg:col-span-3 space-y-8">
        <!-- Profile -->
        <div
          class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-6"
        >
          <h2 class="text-2xl font-semibold mb-6">Profile Information</h2>

          <div class="flex items-center gap-5 mb-8">
            <img
              src="https://placehold.co/120x120"
              class="h-28 w-28 rounded-full object-cover"
            />

            <div>
              <button
                class="rounded-lg bg-[var(--accent-color)] px-5 py-2 text-white"
              >
                Upload Photo
              </button>

              <p class="text-sm mt-2 text-[var(--text-secondary)]">
                JPG, PNG • Max 2MB
              </p>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-5">
            <div>
              <label class="mb-2 block text-sm font-medium">Full Name</label>
              <input
                type="text"
                placeholder="John Doe"
                class="w-full rounded-xl border border-[var(--border-color)] bg-transparent px-4 py-3 outline-none"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium">Username</label>
              <input
                type="text"
                placeholder="@johndoe"
                class="w-full rounded-xl border border-[var(--border-color)] bg-transparent px-4 py-3 outline-none"
              />
            </div>

            <div class="md:col-span-2">
              <label class="mb-2 block text-sm font-medium">Email</label>
              <input
                type="email"
                placeholder="john@example.com"
                class="w-full rounded-xl border border-[var(--border-color)] bg-transparent px-4 py-3 outline-none"
              />
            </div>

            <div class="md:col-span-2">
              <label class="mb-2 block text-sm font-medium">Bio</label>

              <textarea
                rows="5"
                placeholder="Tell readers about yourself..."
                class="w-full rounded-xl border border-[var(--border-color)] bg-transparent px-4 py-3 outline-none"
              ></textarea>
            </div>
          </div>

          <button
            class="mt-6 rounded-xl bg-[var(--accent-color)] px-6 py-3 font-medium text-white"
          >
            Save Changes
          </button>
        </div>

        <!-- Writing -->
        <div
          class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-6"
        >
          <h2 class="text-2xl font-semibold mb-5">Writing Preferences</h2>

          <div class="space-y-5">
            <div class="flex items-center justify-between">
              <span>Default Blog Visibility</span>

              <select
                class="rounded-lg border border-[var(--border-color)] bg-transparent px-4 py-2"
              >
                <option>Public</option>
                <option>Private</option>
              </select>
            </div>

            <div class="flex items-center justify-between">
              <span>Default Editor</span>

              <select
                class="rounded-lg border border-[var(--border-color)] bg-transparent px-4 py-2"
              >
                <option>Rich Text</option>
                <option>Markdown</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Notifications -->
        <div
          class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-6"
        >
          <h2 class="text-2xl font-semibold mb-5">Notifications</h2>

          <div class="space-y-4">
            <label class="flex justify-between">
              <span>Email Notifications</span>
              <input type="checkbox" />
            </label>

            <label class="flex justify-between">
              <span>Likes on Blogs</span>
              <input type="checkbox" />
            </label>

            <label class="flex justify-between">
              <span>Comments</span>
              <input type="checkbox" />
            </label>

            <label class="flex justify-between">
              <span>New Followers</span>
              <input type="checkbox" />
            </label>
          </div>
        </div>

        <!-- Appearance -->
        <div
          class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-6"
        >
          <h2 class="text-2xl font-semibold mb-5">Appearance</h2>

          <div class="flex gap-4">
            <button
              class="rounded-lg border border-[var(--border-color)] px-6 py-3"
            >
              ☀️ Light
            </button>

            <button
              class="rounded-lg border border-[var(--border-color)] px-6 py-3"
            >
              🌙 Dark
            </button>

            <button
              class="rounded-lg border border-[var(--border-color)] px-6 py-3"
            >
              💻 System
            </button>
          </div>
        </div>

        <!-- Security -->
        <div
          class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-6"
        >
          <h2 class="text-2xl font-semibold mb-5">Security</h2>

          <div class="flex flex-wrap gap-4">
            <button
              class="rounded-lg border border-[var(--border-color)] px-5 py-3"
            >
              Change Password
            </button>

            <button
              class="rounded-lg border border-[var(--border-color)] px-5 py-3"
            >
              Logout All Devices
            </button>
          </div>
        </div>

        <!-- Danger Zone -->
        <div class="rounded-2xl border border-red-500 p-6">
          <h2 class="text-2xl font-semibold text-red-500">Danger Zone</h2>

          <p class="mt-2 text-sm text-[var(--text-secondary)]">
            These actions are permanent and cannot be undone.
          </p>

          <div class="mt-6 flex flex-wrap gap-4">
            <button
              class="rounded-lg border border-red-500 px-5 py-3 text-red-500"
            >
              Delete All Blogs
            </button>

            <button class="rounded-lg bg-red-600 px-5 py-3 text-white">
              Delete Account
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
