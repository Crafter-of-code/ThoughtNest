<main class="flex justify-center">
  <section
    class="lg:mx-10! my-5! flex max-lg:mx-4 flex-col gap-5 max-w-360 flex-1 mt-20!"
  >
    @for(user of followingUserDataWithBlog; track $index){
    <app-glass-background padding="p-3">
      <div>
        <div class="flex items-center justify-between mx-2 mb-2">
          <div class="flex items-center gap-2">
            <img
              [src]="user.userPublicImageUrl ?? 'user.png'"
              class="h-10 w-10 rounded-full"
              alt=""
            />
            <h1 class="text-lg">{{ user.userName }}</h1>
          </div>
          <div>
            <p class="text-(--accent-color)">view more</p>
          </div>
        </div>

        <app-short-blog-container
          [skeletonLoading]="skeletonLoading"
          [blogData]="user.shortBlogList"
        /></div
    ></app-glass-background>
    }
  </section>
</main>
