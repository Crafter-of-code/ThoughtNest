<app-main-container (closeButtonClicked)="clicked($event)">
  <!--h-full-->
  <!--h-150!-->
  <!--overflow-scroll-->
  <div class="mx-auto flex max-w-5xl flex-col gap-6">
    <!-- Cover Image -->
    <!---->
    <div class="h-80 w-full overflow-hidden rounded-3xl bg-slate-100">
      <img
        [src]="
          singleBlogData?.coverImage ??
          'https://placehold.co/900x500?text=No+Image'
        "
        class="h-full w-full object-cover"
        loading="lazy"
        alt="Blog Cover"
      />
    </div>

    <!-- Blog Title -->
    <div class="space-y-3">
      <h1 class="text-4xl font-bold leading-tight text-(--text-color)">
        {{ singleBlogData?.blogTitle }}
      </h1>
      <!-- Author -->
      <div
        class="flex flex-wrap items-center justify-between gap-5 rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4"
      >
        <div class="flex items-center gap-4">
          <img
            [src]="singleBlogData?.userImageUrl ?? 'user.png'"
            class="h-12 w-12 rounded-full border object-cover"
          />

          <div>
            <p class="font-semibold text-(--text-color)">
              {{ singleBlogData?.userName }}
            </p>

            <p class="text-sm text-slate-500">
              {{ singleBlogData?.createdAt | date : "dd MMM yyyy" }}
            </p>
          </div>
        </div>

        <div class="flex gap-6 text-sm text-slate-500">
          <span>👁 {{ singleBlogData?.blogViews }}</span>

          <button (click)="sendLikesToBlog(singleBlogData?.blogId ?? '')">
            ❤️ {{ singleBlogData?.blogLikes }}
          </button>

          <button>💬 {{ singleBlogData?.blogComments }}</button>
        </div>
      </div>
      <!-- <p class="text-base leading-7 text-slate-500">
        {{ singleBlogData?.blogSummary }}
      </p> -->
    </div>

    <!-- Blog Content -->
    <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
      <article class="space-y-6 text-[16px] leading-8 text-slate-700">
        <p>{{ singleBlogData?.blogContent }}</p>

        <!-- <p>Blog content...</p> -->

        <!-- <p>Blog content...</p> -->
      </article>
    </div>
  </div>
</app-main-container>
