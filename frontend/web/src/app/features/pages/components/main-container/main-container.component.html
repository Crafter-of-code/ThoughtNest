<!--overflow-hidden-->
<!--overflow-scroll-->
<div
  class="relative w-full rounded-3xl border border-white/20 bg-white shadow-2xl backdrop-blur-sm h-fit"
>
  <!-- Close Button -->
  <button
    class="absolute top-4 right-4 z-20 flex h-10 w-10 items-center justify-center rounded-full border border-gray-300 bg-white text-gray-500 transition hover:border-(--accent-color) hover:text-(--accent-color)"
    (click)="clicked($event)"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 6l12 12M18 6L6 18"
      />
    </svg>
  </button>

  <!-- Dynamic Content -->
  <!--overflow-y-scroll-->
  <div class="h-fit p-8 pt-16">
    <ng-content></ng-content>
  </div>
</div>
