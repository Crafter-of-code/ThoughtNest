<div class="blogContainer mt-0">
  <!-- Section Heading -->
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-2xl font-bold text-(--text-color)">
      {{ containerHeading }}
    </h2>

    <button
      class="text-sm text-(--accent-color) hover:underline transition-colors duration-300 cursor-pointer"
    >
      View All
    </button>
  </div>

  <!-- Blog Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
    <ng-container *ngIf="skeletonLoading; else blogContent">
      <div *ngFor="let arr of skeletonRendering; let i = index">
        <app-home-skeleton-ui />
      </div>
    </ng-container>

    <ng-template #blogContent>
      <ng-container *ngFor="let blogInfo of blogData; let i = index">
        <div
          class="group flex flex-col justify-between rounded-3xl border border-gray-200 bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-2 hover:border-(--accent-color)/40 hover:shadow-xl"
        >
          <!-- Top -->
          <div class="space-y-4">
            <!-- Category Badge -->
            <div>
              <span
                class="rounded-full bg-(--accent-color)/10 px-3 py-1 text-xs font-medium text-(--accent-color)"
              >
                Latest
              </span>
            </div>

            <!-- Title -->
            <h3
              class="text-xl font-semibold leading-7 text-(--text-color) transition-colors duration-300 group-hover:text-(--accent-color)"
            >
              {{ blogInfo.blogTitle }}
            </h3>

            <!-- Content -->
            <p class="text-sm leading-7 text-gray-600 line-clamp-4">
              {{ blogInfo.blogContent }}
            </p>
          </div>

          <!-- Bottom -->
          <div
            class="mt-6 flex items-center justify-between border-t border-gray-100 pt-4"
          >
            <!-- User -->
            <div class="flex items-center gap-3">
              <img
                src="user.png"
                loading="lazy"
                alt="User"
                class="h-11 w-11 rounded-full border-2 border-gray-200 object-cover"
              />

              <div>
                <p class="text-sm font-semibold text-(--text-color)">
                  {{ blogInfo.userName }}
                </p>

                <p class="text-xs text-gray-500">
                  {{ blogInfo.createdAt | date : "dd MMM yyyy" }}
                </p>
              </div>
            </div>

            <!-- Read More -->
            <button
              class="rounded-full bg-(--accent-color)/10 px-4 py-2 text-xs font-semibold text-(--accent-color) transition-all duration-300 hover:bg-(--accent-color) hover:text-white"
              (click)="sendBlogId(blogInfo.blogId)"
            >
              Read →
            </button>
          </div>
        </div>
      </ng-container>
    </ng-template>
  </div>
</div>
