<main
  class="min-h-screen w-full flex items-center justify-center px-4 bg-linear-to-br from-slate-50 via-white to-slate-100"
  aria-label="login page"
>
  <section
    class="w-full max-w-lg rounded-3xl border border-slate-200/80 bg-white/90 backdrop-blur-sm p-8 md:p-10 shadow-xl"
  >
    <!-- Heading -->
    <div class="mb-8">
      <h1
        title="Welcome Back to the Community"
        aria-label="login page heading"
        class="select-none text-4xl font-bold tracking-tight text-slate-900"
      >
        Welcome Back to the Community
      </h1>

      <p
        title="Missed us..!"
        aria-label="login page paragraph"
        class="mt-2 ml-1 select-none text-sm text-slate-500"
      >
        Missed us..!
      </p>
    </div>

    <!-- Form -->
    <form
      class="flex flex-col gap-4"
      [formGroup]="loginData"
      (ngSubmit)="loginHandler()"
    >
      <!-- Email -->
      <div class="flex flex-col">
        <label for="userEmail" class="mb-2 text-sm font-medium text-slate-700">
          User Email
        </label>

        <app-global-input
          inputPlaceHolder="Enter your email address"
          inputType="email"
          inputId="userEmail"
          formControlName="userEmail"
        />

        <p
          *ngIf="
            loginData.get('userEmail')?.hasError('required') &&
            loginData.get('userEmail')?.touched
          "
          class="text-red-500 text-xs! mt-2 ml-3"
        >
          Email is required
        </p>

        <p
          *ngIf="
            loginData.get('userEmail')?.hasError('email') &&
            loginData.get('userEmail')?.touched
          "
          class="text-red-500 text-xs mt-2 ml-3"
        >
          Please enter a valid email address
        </p>
      </div>

      <!-- Password -->
      <div class="flex flex-col">
        <label
          for="userPassword"
          class="mb-2 text-sm font-medium text-slate-700"
        >
          Password
        </label>

        <app-global-input
          inputPlaceHolder="Enter your password"
          inputType="password"
          inputId="userPassword"
          formControlName="userPassword"
        />

        <p
          *ngIf="
            loginData.get('userPassword')?.hasError('required') &&
            loginData.get('userPassword')?.touched
          "
          class="text-red-500 text-xs! mt-2 ml-3"
        >
          Password is required
        </p>

        <p
          *ngIf="
            loginData.get('userPassword')?.hasError('minlength') &&
            loginData.get('userPassword')?.touched
          "
          class="text-red-500 text-xs! mt-2 ml-3"
        >
          Password must be at least 8 characters
        </p>
      </div>

      <!-- Forgot Password -->
      <div class="flex justify-end -mt-2">
        <a
          routerLink="/forgot-password"
          class="text-sm text-slate-500 hover:text-slate-900 transition-colors duration-200"
        >
          Forgot Password?
        </a>
      </div>

      <!-- Submit Button -->
      <div class="">
        <app-solid-button type="submit">
          <p class="px-6 py-2 font-medium">Sign In</p>
        </app-solid-button>
      </div>

      <!-- Redirect -->
      <p class="text-sm text-slate-500 text-center">
        New here?
        <a
          routerLink="/signin"
          class="font-medium text-slate-900 hover:underline underline-offset-2 transition-all duration-200"
        >
          Join the Community
        </a>
      </p>
    </form>
  </section>
</main>
